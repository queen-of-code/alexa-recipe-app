name: Sonar Dotnet Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java (required by SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin Sonar analysis
        run: |
          dotnet sonarscanner begin \
            /k:"gh_alexa_recipe_app" \
            /n:"Github Alexa Recipe App" \
            /o:"queen-of-code-github" \
            /d:sonar.verbose=true \
            /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml" \
            /d:sonar.coverage.exclusions="RecipeApp/tests/**/*.cs,**/*.md" \
            /d:sonar.host.url=https://sonarcloud.io \
            /d:sonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: dotnet build RecipeApp/RecipeApp.sln --configuration Release

      - name: Test
        run: dotnet test RecipeApp/RecipeApp.sln --configuration Release --filter Category!=Integration --collect:"XPlat Code Coverage" --no-build

      - name: End Sonar analysis
        run: dotnet sonarscanner end /d:sonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
