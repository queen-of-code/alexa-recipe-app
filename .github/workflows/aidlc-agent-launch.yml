name: AIDLC agent launch test

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: true
        type: string
      phase:
        description: AIDLC phase
        required: true
        type: choice
        options: [plan, design, build, review, ship]

permissions:
  contents: read
  issues: write

jobs:
  launch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'aidlc_work:unstarted'
    runs-on: ubuntu-latest
    steps:
      - name: Launch AIDLC Cursor agent
        uses: actions/github-script@v7
        env:
          CURSOR_API_KEY:      ${{ secrets.CURSOR_API_KEY }}
          PROJECT_OWNER:       ${{ vars.AIDLC_PROJECT_OWNER }}
          PROJECT_NUMBER:      ${{ vars.AIDLC_PROJECT_NUMBER }}
          AIDLC_PROJECT_PAT:   ${{ secrets.AIDLC_PROJECT_PAT }}
        with:
          github-token: ${{ github.token }}
          script: |
            const OWNER = 'queen-of-code';
            const REPO  = 'alexa-recipe-app';
            const REPO_FULL = OWNER + '/' + REPO;

            const PHASE_MAP = { Plan: 'plan', Design: 'design', Build: 'build', Review: 'review', Ship: 'ship' };
            const TERMINAL  = new Set(['Idea', 'Done', "Won't do"]);

            // 1. Resolve issue number + phase
            let issueNumber, phase;

            if (context.eventName === 'workflow_dispatch') {
              issueNumber = parseInt(context.payload.inputs.issue_number, 10);
              phase = context.payload.inputs.phase;
            } else {
              issueNumber = context.payload.issue.number;
              const projectOwner  = process.env.PROJECT_OWNER  || 'queen-of-code';
              const projectNumber = parseInt(process.env.PROJECT_NUMBER || '6', 10);

              // GITHUB_TOKEN does not have read:project scope for personal
              // account Projects v2. Use AIDLC_PROJECT_PAT (repo secret, PAT
              // with project scope) for this GraphQL call only.
              const projectToken = process.env.AIDLC_PROJECT_PAT || process.env.GITHUB_TOKEN;
              const gqlRes = await fetch('https://api.github.com/graphql', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + projectToken, 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: `
                  query($login: String!, $number: Int!) {
                    user(login: $login) {
                      projectV2(number: $number) {
                        items(first: 100) {
                          nodes {
                            fieldValueByName(name: "AIDLC phase") {
                              ... on ProjectV2ItemFieldSingleSelectValue { name }
                            }
                            content { ... on Issue { number } }
                          }
                        }
                      }
                    }
                  }`, variables: { login: projectOwner, number: projectNumber } }),
              });
              const gqlJson = await gqlRes.json();
              if (gqlJson.errors) { core.setFailed('GraphQL error: ' + JSON.stringify(gqlJson.errors)); return; }
              const result = gqlJson.data;

              const items = result?.user?.projectV2?.items?.nodes ?? [];
              const item  = items.find(i => i.content?.number === issueNumber);
              if (!item) { core.setFailed('Issue #' + issueNumber + ' not on the AIDLC board.'); return; }

              const boardPhase = item?.fieldValueByName?.name ?? '';
              if (TERMINAL.has(boardPhase) || !boardPhase) {
                core.setFailed('Phase "' + boardPhase + '" is terminal or unset.'); return;
              }
              phase = PHASE_MAP[boardPhase];
              if (!phase) { core.setFailed('Unknown phase "' + boardPhase + '".'); return; }
            }

            core.info('Issue #' + issueNumber + ' -> phase: ' + phase);

            // 2. Immediate comment
            const launchComment = await github.rest.issues.createComment({
              owner: OWNER, repo: REPO, issue_number: issueNumber,
              body: ':hourglass: **AIDLC `' + phase + '` phase - launching Cursor agent...**\n\nSwapping labels and calling the Cursor API now.',
            });

            // 3. Swap labels
            await github.rest.issues.removeLabel({ owner: OWNER, repo: REPO, issue_number: issueNumber, name: 'aidlc_work:unstarted' }).catch(() => {});
            await github.rest.issues.addLabels({ owner: OWNER, repo: REPO, issue_number: issueNumber, labels: ['aidlc_work:in_progress'] }).catch(e => { if (e.status !== 422) throw e; });

            // 4. Build phase-scoped prompt.
            // Each prompt names exactly ONE deliverable and a hard stop.
            // This prevents the agent from running into the next AIDLC phase
            // (e.g. plan -> design) since there is no human in the loop to
            // provide the approval gate that the skills expect.
            const phasePrompts = {
              plan: [
                'You are a headless Cursor Cloud Agent running the AIDLC **plan** phase (Product Spec only) for **' + REPO_FULL + '**, issue #' + issueNumber + '.',
                '',
                'HARD STOP: your deliverable is `feature/<slug>/product-spec.md` ONLY.',
                'Do NOT write a Tech Spec. Do NOT do architecture or API design. Do NOT open a PR.',
                '',
                'Steps:',
                '1. Run `gh issue view ' + issueNumber + ' --repo ' + REPO_FULL + '` to read the issue body.',
                '2. Determine the feature slug from the issue (look for "AIDLC feature folder: feature/<slug>/").',
                '3. Read `AGENTS.md` and `docs/AIDLC.md` for process context.',
                '4. Follow `.claude/skills/plan/SKILL.md` to draft `feature/<slug>/product-spec.md`.',
                '   - Run the grounding reviewer (`agent-grounding-reviewer`) against the repo.',
                '   - Because this is a headless run there is no human to ask questions; make reasonable assumptions and note them in the spec under an "Assumptions" section.',
                '5. Commit `product-spec.md` to a branch and open a draft PR for human review.',
                '6. Post a summary comment on issue #' + issueNumber + ' with: a link to the PR, a 2-3 sentence summary, and the instruction "Move the board card to Design and apply aidlc_work:unstarted when the Product Spec is approved to trigger the next phase."',
              ],
              design: [
                'You are a headless Cursor Cloud Agent running the AIDLC **design** phase (Tech Spec only) for **' + REPO_FULL + '**, issue #' + issueNumber + '.',
                '',
                'HARD STOP: your deliverable is `feature/<slug>/tech-spec.md` ONLY.',
                'Do NOT write code. Do NOT open a build PR.',
                '',
                'Steps:',
                '1. Run `gh issue view ' + issueNumber + ' --repo ' + REPO_FULL + '` to read the issue body.',
                '2. Read `feature/<slug>/product-spec.md` (the approved Product Spec).',
                '3. Read `AGENTS.md` and `docs/AIDLC.md` for process context.',
                '4. Follow `.claude/skills/design/SKILL.md` to draft `feature/<slug>/tech-spec.md`.',
                '   - Run relevant review passes (architecture, backend, frontend as applicable).',
                '5. Commit `tech-spec.md` to a branch and open a draft PR.',
                '6. Post a summary comment on issue #' + issueNumber + ' with: a link to the PR, key technical decisions, and "Move the board card to Build and apply aidlc_work:unstarted when the Tech Spec is approved."',
              ],
              build: [
                'You are a headless Cursor Cloud Agent running the AIDLC **build** phase for **' + REPO_FULL + '**, issue #' + issueNumber + '.',
                '',
                'HARD STOP: your deliverable is a PR with passing CI. Do NOT run review or ship.',
                '',
                'Steps:',
                '1. Run `gh issue view ' + issueNumber + ' --repo ' + REPO_FULL + '` to read the issue body.',
                '2. Read `feature/<slug>/tech-spec.md` for the implementation plan.',
                '3. Read `AGENTS.md` and `docs/AIDLC.md` for process context.',
                '4. Follow `.claude/skills/build/SKILL.md` — implement, write tests (TDD), open a PR.',
                '5. Post a summary comment on issue #' + issueNumber + ' with: a link to the PR, what was built, and "Move the board card to Review and apply aidlc_work:unstarted to trigger the review phase."',
              ],
              review: [
                'You are a headless Cursor Cloud Agent running the AIDLC **review** phase for **' + REPO_FULL + '**, issue #' + issueNumber + '.',
                '',
                'HARD STOP: your job is review feedback only. Do NOT merge. Do NOT make code changes.',
                '',
                'Steps:',
                '1. Run `gh issue view ' + issueNumber + ' --repo ' + REPO_FULL + '` to find the open PR.',
                '2. Read `feature/<slug>/tech-spec.md` and the PR diff.',
                '3. Read `AGENTS.md` and `docs/AIDLC.md` for process context.',
                '4. Follow `.claude/skills/review/SKILL.md` — post review feedback as PR comments.',
                '5. Post a summary comment on issue #' + issueNumber + ' and "Move the board card to Ship and apply aidlc_work:unstarted when review is resolved."',
              ],
              ship: [
                'You are a headless Cursor Cloud Agent running the AIDLC **ship** phase (Validate + Learn) for **' + REPO_FULL + '**, issue #' + issueNumber + '.',
                '',
                'Steps:',
                '1. Run `gh issue view ' + issueNumber + ' --repo ' + REPO_FULL + '` to read the issue.',
                '2. Read `feature/<slug>/` specs and the merged PR.',
                '3. Read `AGENTS.md` and `docs/AIDLC.md` for process context.',
                '4. Follow `.claude/skills/ship/SKILL.md` — scorecard vs Product Spec, write ADR and retro.',
                '5. Post a summary comment on issue #' + issueNumber + ' and close the issue if all criteria are met.',
              ],
            };
            const phaseLines = phasePrompts[phase];
            phaseLines.push('');
            phaseLines.push('After completing the above, clear the in-progress label:');
            phaseLines.push('curl -s -X DELETE -H "Authorization: Bearer $AIDLC_GH_CALLBACK_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/' + REPO_FULL + '/issues/' + issueNumber + '/labels/aidlc_work%3Ain_progress');
            const prompt = phaseLines.join('\n');

            // 5. Launch Cursor Cloud Agent
            const autoCreatePr = phase === 'build';
            const launchRes = await fetch('https://api.cursor.com/v0/agents', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + Buffer.from(process.env.CURSOR_API_KEY + ':').toString('base64') },
              body: JSON.stringify({ prompt: { text: prompt }, source: { repository: 'https://github.com/' + REPO_FULL, ref: 'master' }, target: { autoCreatePr, openAsCursorGithubApp: autoCreatePr } }),
            });

            if (!launchRes.ok) {
              const err = await launchRes.text();
              await github.rest.issues.removeLabel({ owner: OWNER, repo: REPO, issue_number: issueNumber, name: 'aidlc_work:in_progress' }).catch(() => {});
              await github.rest.issues.addLabels({ owner: OWNER, repo: REPO, issue_number: issueNumber, labels: ['aidlc_work:unstarted'] }).catch(() => {});
              await github.rest.issues.updateComment({ owner: OWNER, repo: REPO, comment_id: launchComment.data.id,
                body: ':x: **AIDLC `' + phase + '` - failed to launch agent.**\n\nCursor API ' + launchRes.status + ':\n```\n' + err + '\n```\nLabel reset to `aidlc_work:unstarted` - re-apply to retry.' });
              core.setFailed('Cursor API error ' + launchRes.status + ': ' + err); return;
            }

            const agent = await launchRes.json();
            const agentUrl = (agent.target && agent.target.url) ? agent.target.url : ('https://cursor.com/agents?id=' + agent.id);
            core.info('Launched agent ' + agent.id + ' for #' + issueNumber);

            // 6. Update comment with agent link
            await github.rest.issues.updateComment({ owner: OWNER, repo: REPO, comment_id: launchComment.data.id,
              body: ':robot: **AIDLC `' + phase + '` agent is running.**\n\n[Watch it here ->](' + agentUrl + ')\n\nThe agent will post a summary and clear `aidlc_work:in_progress` when done.\n\n<!-- cursor-agent-id: ' + agent.id + ' -->' });
