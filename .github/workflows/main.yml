name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - published
    branches:
      - master
  workflow_dispatch:
    inputs:
      name:
        description: 'Environment'
        required: false
        default: 'Dev'

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet tool
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install dependencies
        run: dotnet restore RecipeApp/RecipeApp.sln

      - name: Build
        run: dotnet build --configuration Release --no-restore RecipeApp/RecipeApp.sln

      - name: Test
        run: dotnet test --no-restore --no-build --configuration Release --logger trx --verbosity minimal RecipeApp/RecipeApp.sln --filter Category!=Integration --collect:"XPlat Code Coverage"

      - name: XUnit Test Report
        uses: dorny/test-reporter@v1.8.0
        if: success() || failure()
        with:
          name: XUnit Results
          path: '**/*.trx'
          reporter: dotnet-trx
          list-suites: all
          list-tests: failed
          token: ${{ github.token }}

      - name: ReportGenerator
        uses: danielpalme/ReportGenerator-GitHub-Action@5.2.4
        with:
          reports: "**/coverage.cobertura.xml"
          reporttypes: "HtmlInline;lcov"
          filefilters: +*
          assemblyfilters: "+RecipeAPI;+Core"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoverageReport
          path: coveragereport/index.htm

      - name: Report Code Coverage
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: coveragereport/lcov.info
          github-token: ${{ github.token }}

  build_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: RecipeApp/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: RecipeApp/frontend
        run: npm ci

      - name: Build frontend
        working-directory: RecipeApp/frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: queen-of-code
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: https://placeholder.run.app
        run: npm run build
