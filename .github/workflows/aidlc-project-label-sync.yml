# Resets `aidlc_work:*` labels when a linked issue's Project (v2) Status field changes.
# Secret: AIDLC_PROJECT_PAT — classic PAT with `repo` + `project` (and `read:org` if needed).
# Repository Variables: AIDLC_PROJECT_NUMBER (required for projects_v2_item path), optional AIDLC_ORG, AIDLC_STATUS_FIELD_NAME (default Status).
# If `projects_v2_item` does not fire in your setup, use Actions "Run workflow" with issue number + status.

name: AIDLC project label sync

on:
  projects_v2_item:
    types: [edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number in this repository (manual test)
        required: true
        type: string
      status_name:
        description: Current Status value (e.g. Plan, Idea, Won't do)
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          AIDLC_ORG: ${{ vars.AIDLC_ORG }}
          AIDLC_PROJECT_NUMBER: ${{ vars.AIDLC_PROJECT_NUMBER }}
          AIDLC_STATUS_FIELD_NAME: ${{ vars.AIDLC_STATUS_FIELD_NAME }}
        with:
          github-token: ${{ secrets.AIDLC_PROJECT_PAT }}
          script: |
            const core = require('@actions/core');

            const orgVar = (process.env.AIDLC_ORG || '').trim();
            const owner = orgVar || context.repo.owner;
            const repo = context.repo.repo;
            const repoFull = `${owner}/${repo}`;
            const projectNumber = parseInt(process.env.AIDLC_PROJECT_NUMBER || '', 10);
            const statusFieldName = process.env.AIDLC_STATUS_FIELD_NAME || 'Status';
            const aidlcLabels = ['aidlc_work:unstarted', 'aidlc_work:in_progress'];

            function isNoCron(name) {
              if (!name) return false;
              const n = name.trim();
              if (n === 'Idea' || n === 'Done') return true;
              return /^Won[\u2019']t do$/i.test(n);
            }

            async function removeAidlcLabels(issueNumber) {
              for (const name of aidlcLabels) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name });
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              }
            }

            async function addUnstarted(issueNumber) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['aidlc_work:unstarted'],
              });
            }

            let issueNumber;
            let statusName;

            if (context.eventName === 'workflow_dispatch') {
              issueNumber = parseInt(context.payload.inputs.issue_number, 10);
              statusName = context.payload.inputs.status_name;
              if (!Number.isFinite(issueNumber)) {
                core.setFailed('issue_number must be a number.');
                return;
              }
            } else {
              if (!Number.isFinite(projectNumber)) {
                core.warning('Set repository Variable AIDLC_PROJECT_NUMBER (from the project URL). Skipping.');
                return;
              }

              const pv2 = context.payload.projects_v2_item;
              const changes = context.payload.changes;
              if (!pv2 || pv2.content_type !== 'Issue') {
                core.info('Skip: not an issue item.');
                return;
              }
              if (changes && changes.field_value && changes.field_value.field_type !== 'single_select') {
                core.info('Skip: not a single-select field change.');
                return;
              }

              const itemId = pv2.node_id;
              const q = `query($id: ID!) {
                node(id: $id) {
                  ... on ProjectV2Item {
                    fieldValues(first: 40) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          field { ... on ProjectV2SingleSelectField { name } }
                        }
                      }
                    }
                    content {
                      ... on Issue {
                        number
                        repository { nameWithOwner }
                      }
                    }
                  }
                }
              }`;

              const data = await github.graphql(q, { id: itemId });
              const node = data.node;
              if (!node || !node.content) {
                core.warning('Could not resolve issue from project item.');
                return;
              }
              if (node.content.repository.nameWithOwner !== repoFull) {
                core.info(`Skip: issue is in ${node.content.repository.nameWithOwner}, not this repo.`);
                return;
              }
              issueNumber = node.content.number;

              for (const fv of node.fieldValues.nodes) {
                if (fv.field && fv.field.name === statusFieldName) {
                  statusName = fv.name;
                  break;
                }
              }
              if (!statusName) {
                core.info(`Skip: no "${statusFieldName}" value on item.`);
                return;
              }
            }

            core.info(`Issue #${issueNumber}, Status="${statusName}" — syncing aidlc_work labels.`);

            await removeAidlcLabels(issueNumber);
            if (!isNoCron(statusName)) {
              await addUnstarted(issueNumber);
            }
