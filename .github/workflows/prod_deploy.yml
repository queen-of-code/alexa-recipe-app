name: Deploy to Production

on:
  release:
    types:
      - published

jobs:
  deploy_api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push API image
        env:
          IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/recipe-docker/recipeapi:${{ github.sha }}
        run: |
          docker build -t $IMAGE -f RecipeApp/RecipeAPI/Dockerfile RecipeApp
          docker push $IMAGE

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: recipe-api
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/recipe-docker/recipeapi:${{ github.sha }}
          service_account: recipe-app-backend@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          env_vars: |
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          flags: --remove-secrets=GOOGLE_APPLICATION_CREDENTIALS --service-account=recipe-app-backend@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

  deploy_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: RecipeApp/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: RecipeApp/frontend
        run: npm ci

      - name: Build frontend
        working-directory: RecipeApp/frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: queen-of-code
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: ${{ secrets.CLOUD_RUN_API_URL }}
        run: npm run build

      - name: Deploy frontend to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: queen-of-code
          target: qoc-recipe-app
          entryPoint: RecipeApp/frontend
          channelId: live

  integration_test:
    runs-on: ubuntu-latest
    needs: [deploy_api, deploy_frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: dotnet restore RecipeApp/RecipeApp.sln

      - name: Build
        run: dotnet build --configuration Release --no-restore RecipeApp/RecipeApp.sln

      - name: Test
        env:
          RecipeEnv: Production
          CLOUD_RUN_API_URL: ${{ secrets.CLOUD_RUN_API_URL }}
          FIREBASE_TEST_USER_TOKEN: ${{ secrets.FIREBASE_TEST_USER_TOKEN }}
        run: dotnet test --no-restore --no-build --configuration Release --verbosity normal RecipeApp/RecipeApp.sln --filter Category=Integration
