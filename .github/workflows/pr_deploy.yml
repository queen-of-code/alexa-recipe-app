name: Deploy PR Preview

on:
  pull_request:
    branches: [master]

jobs:
  preview_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: RecipeApp/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: RecipeApp/frontend
        run: npm ci

      - name: Build frontend
        working-directory: RecipeApp/frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: queen-of-code
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: ${{ secrets.CLOUD_RUN_API_URL }}
        run: npm run build

      - name: Deploy PR preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: queen-of-code
          target: qoc-recipe-app
          entryPoint: RecipeApp/frontend
          channelId: pr-${{ github.event.number }}
          expires: 7d
