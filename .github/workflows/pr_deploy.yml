name: Integration Tests (PR)

on:
  pull_request:
    branches: [master]

jobs:
  integration_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build firebase-emulator image (cached)
        uses: docker/build-push-action@v6
        with:
          context: RecipeApp
          file: RecipeApp/firebase-emulator/Dockerfile
          load: true
          tags: recipeapp-firebase-emulator:latest
          cache-from: type=gha,scope=firebase-emulator
          cache-to: type=gha,mode=max,scope=firebase-emulator

      - name: Build recipeapi image (cached)
        uses: docker/build-push-action@v6
        with:
          context: RecipeApp
          file: RecipeApp/RecipeAPI/Dockerfile.dev
          load: true
          tags: recipeapp-recipeapi:latest
          cache-from: type=gha,scope=recipeapi
          cache-to: type=gha,mode=max,scope=recipeapi

      - name: Start backend services
        run: docker compose -f RecipeApp/docker-compose.yml up -d firebase-emulator recipeapi

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            echo "  attempt $i/30..."
            sleep 5
          done
          echo "API did not become ready in time"
          docker compose -f RecipeApp/docker-compose.yml logs
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run integration tests
        env:
          RecipeEnv: local
        run: |
          dotnet test RecipeApp/RecipeApp.sln \
            --filter Category=Integration \
            --logger trx \
            --verbosity normal

      - name: Integration test report
        uses: dorny/test-reporter@v1.8.0
        if: success() || failure()
        with:
          name: Integration Test Results
          path: '**/*.trx'
          reporter: dotnet-trx
          list-suites: all
          list-tests: failed
          token: ${{ github.token }}

      - name: Tear down
        if: always()
        run: docker compose -f RecipeApp/docker-compose.yml down -v
