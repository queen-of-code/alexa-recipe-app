services:
  firebase-emulator:
    build:
      context: .
      dockerfile: ./firebase-emulator/Dockerfile
    image: recipeapp-firebase-emulator:latest
    platform: linux/amd64
    working_dir: /app
    ports:
      - "4000:4000"  # Emulator UI
      - "8080:8080"  # Firestore
      - "9099:9099"  # Auth
    volumes:
      - ./frontend/firebase.json:/app/firebase.json
      - emulator_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9099 && nc -z 127.0.0.1 8080"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  recipeapi:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./RecipeAPI/Dockerfile.dev
    image: recipeapp-recipeapi:latest
    depends_on:
      firebase-emulator:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: 'Development'
      ASPNETCORE_URLS: 'http://+:80'
      GCP_PROJECT_ID: 'queen-of-code'
      FIRESTORE_EMULATOR_HOST: 'firebase-emulator:8080'
      FIREBASE_AUTH_EMULATOR_HOST: 'firebase-emulator:9099'
    ports:
      - "8081:80"  # 8080 is taken by the Firestore emulator

  frontend:
    image: node:20-alpine
    platform: linux/amd64
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - recipeapi
    environment:
      VITE_USE_EMULATOR: 'true'
      VITE_API_URL: 'http://localhost:8081'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  emulator_data: {}
