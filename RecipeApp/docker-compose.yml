services:
  firebase-emulator:
    image: node:20-alpine
    platform: linux/amd64
    working_dir: /app
    command: >
      sh -c "apk add --no-cache openjdk21-jre-headless &&
             npm install -g firebase-tools &&
             firebase emulators:start --project queen-of-code --import=/data --export-on-exit=/data"
    ports:
      - "4000:4000"  # Emulator UI
      - "8080:8080"  # Firestore
      - "9099:9099"  # Auth
    volumes:
      - ./frontend/firebase.json:/app/firebase.json
      - emulator_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  recipeapi:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./RecipeAPI/Dockerfile.dev
    depends_on:
      firebase-emulator:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: 'Development'
      ASPNETCORE_URLS: 'http://+:80'
      GCP_PROJECT_ID: 'queen-of-code'
      FIRESTORE_EMULATOR_HOST: 'firebase-emulator:8080'
      FIREBASE_AUTH_EMULATOR_HOST: 'firebase-emulator:9099'
    ports:
      - "8081:80"  # 8080 is taken by the Firestore emulator

  frontend:
    image: node:20-alpine
    platform: linux/amd64
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - recipeapi
    environment:
      VITE_USE_EMULATOR: 'true'
      VITE_API_URL: 'http://localhost:8081'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  emulator_data: {}
